services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campo_minado
      POSTGRES_USER: campo_minado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campo_minado_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campo_minado -d campo_minado"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://campo_minado:${POSTGRES_PASSWORD:-campo_minado_dev}@postgres:5432/campo_minado
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    env_file:
      - path: ./frontend/.env.local
        required: false
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: campo_minado_test
      POSTGRES_USER: campo_minado_test
      POSTGRES_PASSWORD: campo_minado_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campo_minado_test -d campo_minado_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

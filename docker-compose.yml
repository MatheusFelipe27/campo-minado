services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campo_minado
      POSTGRES_USER: campo_minado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campo_minado_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campo_minado -d campo_minado"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
